<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0"
    />
    <!-- Dark in both themes: the brand bar at the top of the page is always dark. -->
    <meta name="theme-color" content="#080B10" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply the saved theme before first paint, so a light-theme reader never
      // sees a dark frame. Dark is the default. Key and values must match
      // src/lib/theme.js (tests/theme.test.js checks).
      (function () {
        var theme = "dark";
        try {
          if (localStorage.getItem("acs-abx:theme") === "light") theme = "light";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ACS Abx" />
    <meta
      name="description"
      content="Bedside reference for the MU Health Acute Care Surgery Antibiotic Practice Management Guideline (December 2025): regimen, dose, frequency, duration, redosing and the PNC allergy / alternative column by indication."
    />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://acs-antibiotics.web.app/" />
    <meta property="og:title" content="ACS Antibiotic Guide — MU Health Acute Care Surgery" />
    <meta
      property="og:description"
      content="Antibiotic regimen, dose, duration and the PNC allergy / alternative column by surgical indication, from the December 2025 Practice Management Guideline."
    />
    <meta property="og:image" content="https://acs-antibiotics.web.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts are self-hosted via @fontsource (imported in main.jsx), so typography works offline. -->
    <title>ACS Antibiotic Guide — MU Health Acute Care Surgery</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
